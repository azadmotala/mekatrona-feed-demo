# Once a day at 07:17 UTC (GitHub may start a scheduled run late), on demand, and whenever main
# changes: test the converter, turn every recipe into the dial's file, and publish the files and the
# recipe page, with the setup mock beside it, to GitHub Pages. 07 UTC because no scheduled run that
# started then failed (8 of the 130 from 2026-10-24 to 11-24), and :17 to stay off the hour, when
# GitHub's queue is busiest.
name: Publish feeds

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Test the converter
        run: python3 -m unittest -v test_convert.py
      - name: Convert every recipe
        run: python3 convert.py --out _site --published "${{ steps.pages.outputs.base_url }}"
      - name: Add the recipe page and the setup mock
        run: cp index.html wizard.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # GitHub sometimes lists no artifact for a moment after it is finalized (3 of 15 runs,
      # 2026-11-20 to 23, all within 0.8 s of the upload): wait, then deploy once more.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
